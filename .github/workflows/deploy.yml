name: Deploy to Cloudflare Workers

# Deploys the Next.js app (via OpenNext) to Cloudflare Workers on every push to
# main. Requires two GitHub repository secrets:
#   - CLOUDFLARE_API_TOKEN  (Workers + D1 edit permissions)
#   - CLOUDFLARE_ACCOUNT_ID  (8cb2a847eebdd3fe5e6d13b2bd6714bb)
# Optional (recommended) for admin endpoints:
#   - ADMIN_API_KEY          (set once via `wrangler secret put`, not needed here)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare env types
        run: npm run cf-typegen

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply DB --remote

      - name: Build and deploy
        run: npm run deploy
